<header class="ae-topnav">
    <div class="ae-topnav__inner">
        <a class="ae-brand" href="{{ url_for('main.index') }}">Steup Growth</a>

        <nav class="ae-navlinks" aria-label="Primary">
            <a class="ae-navlink{% if active_page == 'index' %} is-active{% endif %}" href="{{ url_for('main.index') }}" data-i18n="nav.appShell.home">首頁</a>
            <a class="ae-navlink{% if active_page == 'chatbox' %} is-active{% endif %}" href="{{ url_for('main.chatbox_page') }}" data-i18n="nav.appShell.aiChat">AI 聊天</a>
            <a class="ae-navlink{% if active_page == 'pose' %} is-active{% endif %}" href="{{ url_for('main.pose_detection_page') }}" data-i18n="nav.appShell.pose">姿態</a>
            <a class="ae-navlink{% if active_page == 'video' %} is-active{% endif %}" href="{{ url_for('main.video_management_page') }}" data-i18n="nav.appShell.video">影片</a>
            {% if user and user.is_admin() %}
            <a class="ae-navlink{% if active_page == 'admin' %} is-active{% endif %}" href="/admin" data-i18n="nav.appShell.admin">管理後台</a>
            {% endif %}
        </nav>

        <div class="ae-topnav__actions">
            {% if user %}
            <button class="ae-icon-btn" id="settings" type="button" data-i18n-title="settings" title="設定" aria-label="Settings">
                <i class="fas fa-gear"></i>
            </button>
            <button class="ae-action-btn ae-btn--danger" id="logout" type="button" data-i18n-title="logout" title="登出">
                <i class="fas fa-right-from-bracket"></i>
                <span data-i18n="logout">登出</span>
            </button>
            {% else %}
            <a class="ae-action-btn ae-btn--primary" href="{{ url_for('main.login_page') }}">
                <i class="fas fa-user"></i>
                <span data-i18n="nav.appShell.login">登入</span>
            </a>
            {% endif %}
        </div>
    </div>
</header>
