<!DOCTYPE html>
<html lang="zh-tw" data-i18n-pending="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steup Growth AI Chat</title>
    <script>
        try {
            const preferredLang = localStorage.getItem('preferredLanguage') || 'zh-TW';
            document.documentElement.setAttribute('lang', preferredLang.toLowerCase());
            var _t = localStorage.getItem('themeMode');
            if (_t === 'dark' || (_t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark-theme-early');
            }
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/aeon.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbox.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="app-shell chatbox-page">
    {% set active_page = 'chatbox' %}

    <main class="ae-main chatbox-shell">
        <div id="main-content">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <button type="button" class="sidebar-toggle" id="sidebarToggle" data-i18n-title="toggleSidebar" title="切換側邊欄"><i class="fas fa-bars"></i></button>
                </div>

                <nav class="sidebar-nav" aria-label="Chat sidebar navigation">
                    <a class="sidebar-nav-link{% if active_page == 'index' %} is-active{% endif %}" href="/"><i class="fas fa-house"></i> <span data-i18n="nav.home">首頁</span></a>
                    <a class="sidebar-nav-link{% if active_page == 'pose' %} is-active{% endif %}" href="/pose_detection"><i class="fas fa-person-running"></i> <span data-i18n="nav.pose">姿態</span></a>
                    <a class="sidebar-nav-link{% if active_page == 'video' %} is-active{% endif %}" href="/video"><i class="fas fa-video"></i> <span data-i18n="nav.video">影片</span></a>
                </nav>

                <div class="sidebar-section">
                    <h3>聊天</h3>
                    <ul class="chat-list">
                        <li class="empty-state">載入中...</li>
                    </ul>
                </div>

                <div class="sidebar-footer">
                    <button type="button" class="sidebar-btn" id="newChat"><i class="fas fa-plus"></i> <span data-i18n="newChat">新對話</span></button>
                    <button type="button" class="sidebar-btn" id="settings" data-i18n-title="settings.title" title="設定"><i class="fas fa-gear"></i> <span data-i18n="settings">設定</span></button>
                    <button type="button" class="sidebar-btn sidebar-btn--danger" id="logout" data-i18n-title="logout.title" title="登出"><i class="fas fa-right-from-bracket"></i> <span data-i18n="logout">登出</span></button>
                </div>
            </aside>

            <section id="chat-container">
                <div id="chat-header">
                    <div class="chat-header-left">
                        <button type="button" class="sidebar-show-btn" id="sidebarShowBtn" style="display: none;" data-i18n-title="showSidebar" title="顯示側邊欄"><i class="fas fa-bars"></i></button>
                        <a class="chat-header-brand" href="/"><i class="fas fa-baby"></i> Steup Growth</a>
                    </div>
                    <div class="chat-header-center" id="chatHeaderCenter">
                        <span id="chatHeaderTitle"></span>
                        <button type="button" class="chat-header-pin" id="chatHeaderPin" data-i18n-title="pinAction" title="置頂" style="display:none;"><i class="fas fa-thumbtack"></i></button>
                    </div>
                    <div class="chat-header-right" id="chatHeaderActions" style="display:none;">
                        <button type="button" class="chat-header-dots" id="chatHeaderMenuBtn" data-i18n-title="chatHeader.more" title="更多"><i class="fas fa-ellipsis-v"></i></button>
                        <div class="chat-header-dropdown" id="chatHeaderDropdown">
                            <button type="button" class="chat-header-dropdown-item" id="chPinBtn"><i class="fas fa-thumbtack"></i> <span data-i18n="pinAction">置頂</span></button>
                            <button type="button" class="chat-header-dropdown-item" id="chRenameBtn"><i class="fas fa-pen"></i> <span data-i18n="renameAction">重新命名</span></button>
                            <button type="button" class="chat-header-dropdown-item" id="chDeleteBtn"><i class="fas fa-trash"></i> <span data-i18n="deleteAction">刪除</span></button>
                        </div>
                    </div>
                </div>

                <div id="messages"></div>

                <div id="welcome-screen">
                    <div class="welcome-content">
                        <div class="welcome-avatar-circle">
                            <i class="fas fa-stethoscope"></i>
                        </div>
                        <h2 class="welcome-title">Steup Growth AI</h2>
                        <p class="welcome-subtitle" id="welcomeSubtitleText" data-i18n="welcomeMsg">您好！我是專注於幼兒成長分析的兒童發育陪伴者。</p>
                        <div class="welcome-capabilities">
                            <div class="welcome-capability" data-i18n="welcome.capability.review">回顧上傳的影片</div>
                            <div class="welcome-capability" data-i18n="welcome.capability.summarize">總結姿態分析結果</div>
                            <div class="welcome-capability" data-i18n="welcome.capability.explain">為家長解釋報告</div>
                        </div>
                    </div>
                </div>

                <div id="input-container">
                    <div class="input-wrapper">
                        <div class="input-main-row">
                            <div class="input-field-wrapper">
                                <div id="filePreviewContainer" class="file-preview-container" style="display: none;"></div>
                                <div class="input-field-row">
                                    <div class="input-field-left">
                                    <div class="btn-popup-wrapper">
                                        <div id="plusMenu" class="plus-menu" style="display:none;">
                                            <button type="button" class="plus-menu-item" id="fileUploadBtn">
                                                <span class="pmi-icon"><i class="fas fa-paperclip"></i></span>
                                                <span class="pmi-label">上載文件</span>
                                            </button>
                                            <button type="button" class="plus-menu-item" id="voiceInputBtn">
                                                <span class="pmi-icon"><i class="fas fa-microphone"></i></span>
                                                <span class="pmi-label">語音輸入</span>
                                            </button>
                                            <button type="button" class="plus-menu-item" id="webcamBtn">
                                                <span class="pmi-icon"><i class="fas fa-camera"></i></span>
                                                <span class="pmi-label">攝影機</span>
                                            </button>
                                        </div>
                                        <button type="button" id="plusMenuBtn" class="input-action-btn plus-btn" data-i18n-title="toolbar.more" title="更多選項">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>

                                <textarea id="messageInput" rows="1" placeholder="在這裡輸入您的問題..."></textarea>
                                <input type="file" id="fileInput" accept="image/*,video/*,application/pdf" multiple style="display: none;">

                                <div class="input-field-right">
                                    <div class="btn-popup-wrapper">
                                        <div id="modelDropdown" class="model-dropdown" style="display:none;">
                                            <button type="button" class="model-dropdown-item" data-model="gemini-3-flash-preview">
                                                <div class="mdi-info">
                                                    <span class="mdi-name">Flash</span>
                                                    <span class="mdi-desc">快速回應・日常對話</span>
                                                </div>
                                            </button>
                                            <button type="button" class="model-dropdown-item" data-model="gemini-3.1-pro-preview">
                                                <div class="mdi-info">
                                                    <span class="mdi-name">Pro</span>
                                                    <span class="mdi-desc">強大精準・深度分析</span>
                                                </div>
                                            </button>
                                        </div>
                                        <button type="button" id="inputModelBtn" class="input-model-btn" data-i18n-title="switchModel" title="切換 AI 模型">
                                            <span id="inputModelLabel">Flash</span>
                                            <i class="fas fa-chevron-up" id="inputModelChevron"></i>
                                        </button>
                                    </div>
                                    <button type="button" id="sendButton" data-i18n-title="sendMessage" title="發送訊息"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="emojiPicker" class="emoji-picker" style="display: none;">
                        <div class="emoji-header">
                            <span class="emoji-tab active" data-category="smileys">😊</span>
                            <span class="emoji-tab" data-category="gestures">👋</span>
                            <span class="emoji-tab" data-category="animals">🐱</span>
                            <span class="emoji-tab" data-category="food">🍕</span>
                            <span class="emoji-tab" data-category="activities">⚽</span>
                            <span class="emoji-tab" data-category="travel">✈️</span>
                            <span class="emoji-tab" data-category="objects">💡</span>
                            <span class="emoji-tab" data-category="symbols">❤️</span>
                        </div>
                        <div class="emoji-content" id="emojiContent"></div>
                    </div>

                    <div id="webcamModal" class="webcam-modal" style="display: none;">
                        <div class="webcam-content">
                            <div class="webcam-header">
                                <h3 data-i18n="webcam.title">拍照</h3>
                                <button type="button" class="close-webcam" id="closeWebcam" data-i18n-title="webcam.closeTitle" title="關閉攝影機">&times;</button>
                            </div>
                            <div class="webcam-body">
                                <video id="webcamVideo" autoplay playsinline></video>
                                <canvas id="webcamCanvas" style="display: none;"></canvas>
                            </div>
                            <div class="webcam-footer">
                                <button type="button" class="webcam-action-btn" id="captureBtn"><i class="fas fa-camera"></i> <span data-i18n="webcam.capture">拍照</span></button>
                                <button type="button" class="webcam-action-btn" id="retakeBtn" style="display: none;"><i class="fas fa-redo"></i> <span data-i18n="webcam.retake">重拍</span></button>
                                <button type="button" class="webcam-action-btn primary" id="usePhotoBtn" style="display: none;"><i class="fas fa-check"></i> <span data-i18n="webcam.usePhoto">使用照片</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <aside id="preview-panel" class="preview-panel">
                <div class="preview-header">
                    <h3 id="preview-title" data-i18n="preview.title">文件預覽</h3>
                    <button type="button" class="close-preview" id="closePreview" data-i18n-title="preview.closeTitle" title="關閉預覽">&times;</button>
                </div>
                <div class="preview-content" id="preview-content"></div>
            </aside>
        </div>
    </main>

    {% include 'setting.html' %}

    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = '/login';
        }
    </script>

    <script src="{{ url_for('static', filename='js/app_shell.js') }}"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="{{ url_for('static', filename='js/socket_module.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api_module.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chatbox.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/uploads.js') }}"></script>
</body>
</html>
